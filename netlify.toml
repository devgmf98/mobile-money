# Build settings live here rather than only in the Netlify UI. netlify.toml
# takes precedence over the dashboard, so with these in the repo a deploy
# cannot quietly build the wrong directory or publish a folder nobody rebuilt
# -- which is what left the site serving an AgentDashboard chunk built from
# older source than main while the deploy log still said "published".
#
# The repo is an npm workspace: the root build script delegates to the frontend
# workspace, which writes to frontend/dist.
[build]
  command = "npm run build"
  publish = "frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Chrome blocks getUserMedia when a Permissions-Policy withholds it. Nothing
# here set one, so the browser default applied — but stating it means a header
# added later (by a plugin, or another rule) cannot silently disable the
# camera on the profile page.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"

# Why the "Failed to fetch dynamically imported module" errors happen, and the
# half of the fix that belongs on the server.
#
# Asset filenames carry a hash of their contents, so a given URL under /assets
# never changes meaning and can be cached for a year. index.html is the
# opposite: it is the one file that says which hashed chunks make up the
# current build, and a stale copy of it asks for chunks a deploy has already
# deleted. Netlify revalidates HTML by default, but nothing said so out loud,
# and a proxy or a phone browser reusing a cached page would still hold the
# old references.
#
# The other half is in src/utils/lazyWithRetry.js, for the page that was
# already open when the deploy landed and has no reason to ask again.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
