name: moneypay
description: "MoneyPay South Sudan - send, receive and manage your money."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # State + storage
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Feature packages
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  # System notifications on Android and iOS. Local rather than push: the app
  # already learns about events over its socket, so what was missing was the
  # tray entry, not the delivery.
  flutter_local_notifications: ^18.0.1
  # Push, for the case a local notification cannot reach: the app closed, no
  # socket, nothing running. The server sends to a device token instead.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
