# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which assumes a
# large development machine. On a 8GB box that ceiling is above physical RAM,
# so the daemon grows into swap until the OS kills it - "Gradle build daemon
# disappeared unexpectedly" partway through assembleRelease. A ceiling that
# fits makes the JVM collect garbage instead of growing, which is slower per
# build but finishes.
#
# Raise these again on a machine with the memory to back them.
# Raised from 1536m when core library desugaring came in with
# flutter_local_notifications: D8 rewrites every java.time call in the app and
# its dependencies in one pass, and Firebase added a lot of dependencies to
# rewrite. At 1536m the daemon crashed outright rather than running slowly.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Same reasoning: parallel module builds multiply peak memory, and this project
# has one module, so there is nothing to gain from it here.
org.gradle.parallel=false

android.useAndroidX=true
